# Outputs — consumed by deploy.sh, the seed script, and the frontend.
# =============================================================================
Outputs:
  AgentCoreMemoryId:
    Description: AgentCore Memory store id (also passed to every Runtime as MEMORY_ID).
    Value: !Ref AgentCoreMemory
    Export:
      Name: !Sub "${AWS::StackName}-MemoryId"

  AgentCoreMemoryArn:
    Description: AgentCore Memory ARN.
    Value: !GetAtt AgentCoreMemory.MemoryArn
    Export:
      Name: !Sub "${AWS::StackName}-MemoryArn"

  AgentCoreGatewayUrl:
    Description: MCP gateway URL (use this as the GATEWAY_URL env var for any client).
    Value: !GetAtt AgentCoreGateway.GatewayUrl
    Export:
      Name: !Sub "${AWS::StackName}-GatewayUrl"

  AgentCoreGatewayId:
    Value: !Ref AgentCoreGateway
    Export:
      Name: !Sub "${AWS::StackName}-GatewayId"

  WorkloadIdentityId:
    Value: !Ref AgentCoreWorkloadIdentity
    Export:
      Name: !Sub "${AWS::StackName}-WorkloadIdentityId"

  SupervisorRuntimeArn:
    Value: !GetAtt SupervisorRuntime.AgentRuntimeArn
    Export:
      Name: !Sub "${AWS::StackName}-SupervisorRuntimeArn"

  QualityAgentRuntimeArn:
    Value: !GetAtt QualityAgentRuntime.AgentRuntimeArn
  SafetyAgentRuntimeArn:
    Value: !GetAtt SafetyAgentRuntime.AgentRuntimeArn
  SecurityAgentRuntimeArn:
    Value: !GetAtt SecurityAgentRuntime.AgentRuntimeArn
  TestAgentRuntimeArn:
    Value: !GetAtt TestAgentRuntime.AgentRuntimeArn
  DeploymentAgentRuntimeArn:
    Value: !GetAtt DeploymentAgentRuntime.AgentRuntimeArn
  IntegrationAgentRuntimeArn:
    Value: !GetAtt IntegrationAgentRuntime.AgentRuntimeArn

  SupervisorEcrRepoUri:
    Value: !GetAtt SupervisorEcrRepo.RepositoryUri
  QualityAgentEcrRepoUri:
    Value: !GetAtt QualityAgentEcrRepo.RepositoryUri
  SafetyAgentEcrRepoUri:
    Value: !GetAtt SafetyAgentEcrRepo.RepositoryUri
  SecurityAgentEcrRepoUri:
    Value: !GetAtt SecurityAgentEcrRepo.RepositoryUri
  TestAgentEcrRepoUri:
    Value: !GetAtt TestAgentEcrRepo.RepositoryUri
  DeploymentAgentEcrRepoUri:
    Value: !GetAtt DeploymentAgentEcrRepo.RepositoryUri
  IntegrationAgentEcrRepoUri:
    Value: !GetAtt IntegrationAgentEcrRepo.RepositoryUri

  AgentCoreBridgeFunctionArn:
