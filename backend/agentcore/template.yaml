    Export:
      Name: !Sub "${AWS::StackName}-JiraTable"
  KnowledgeGraphTableName:
    Value: !Ref KnowledgeGraphTable
    Export:
      Name: !Sub "${AWS::StackName}-KnowledgeGraphTable"
  CostTrackingTableName:
    Value: !Ref CostTrackingTable
    Export:
      Name: !Sub "${AWS::StackName}-CostTrackingTable"
