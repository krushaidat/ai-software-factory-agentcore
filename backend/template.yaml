AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Software Factory — Backend (WebSocket + HTTP APIs, Lambda, DynamoDB)

Parameters:
  Stage:
    Type: String
    Default: prod
  ProjectName:
    Type: String
    Default: ai-software-factory

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        SESSIONS_TABLE: !Ref SessionsTable
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        WEBSOCKET_API_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
        PIPELINE_RUNS_TABLE: !Ref PipelineRunsTable

Resources:
  # ──────────────────────────────────────────────
  # WebSocket API Gateway
  # ──────────────────────────────────────────────
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-websocket-${Stage}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${ConnectIntegration}"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub "integrations/${DefaultIntegration}"

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketMessageFunction.Arn}/invocations"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Stage
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  # Lambda invoke permissions for WebSocket API
  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect"

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect"

  DefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketMessageFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default"

  # ──────────────────────────────────────────────
  # HTTP API Gateway (REST)
  # ──────────────────────────────────────────────
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-http-${Stage}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  PostSessionsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SessionManagerFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  PostSessionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/sessions"
      Target: !Sub "integrations/${PostSessionsIntegration}"

  GetSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/sessions/{sessionId}"
      Target: !Sub "integrations/${PostSessionsIntegration}"

  SessionManagerHttpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SessionManagerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  # ──────────────────────────────────────────────
  # DynamoDB Tables
  # ──────────────────────────────────────────────
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-sessions-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-connections-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SessionIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PipelineRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-pipeline-runs-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: runId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: runId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ──────────────────────────────────────────────
  # Lambda Layer
  # ──────────────────────────────────────────────
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ProjectName}-common-${Stage}"
      Description: Shared utilities for AI Software Factory
      ContentUri: layers/common
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64

  # ──────────────────────────────────────────────
  # Lambda Functions
  # ──────────────────────────────────────────────
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ws-connect-${Stage}"
      Handler: app.handler
      CodeUri: functions/websocket-connect
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ws-disconnect-${Stage}"
      Handler: app.handler
      CodeUri: functions/websocket-disconnect
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ws-message-${Stage}"
      Handler: app.handler
      CodeUri: functions/websocket-message
      Environment:
        Variables:
          COPILOT_FUNCTION_NAME: !Ref CopilotFunction
          PIPELINE_START_FUNCTION_NAME: !Ref PipelineStartFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt CopilotFunction.Arn
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt PipelineStartFunction.Arn

  CopilotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-copilot-${Stage}"
      Handler: app.handler
      CodeUri: functions/copilot
      MemorySize: 512
      Timeout: 90
      ReservedConcurrentExecutions: 2
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  SessionManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-session-manager-${Stage}"
      Handler: app.handler
      CodeUri: functions/session-manager
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ──────────────────────────────────────────────
  # Pipeline Functions
  # ──────────────────────────────────────────────
  PipelineStartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-pipeline-start-${Stage}"
      Handler: app.handler
      CodeUri: functions/pipeline-start
      Timeout: 30
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref PipelineStateMachine
          PIPELINE_RUNS_TABLE: !Ref PipelineRunsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PipelineRunsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref PipelineStateMachine
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  PipelineStageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-pipeline-stage-${Stage}"
      Handler: app.handler
      CodeUri: functions/pipeline-stage
      MemorySize: 512
      Timeout: 120
      ReservedConcurrentExecutions: 3
      Environment:
        Variables:
          PIPELINE_RUNS_TABLE: !Ref PipelineRunsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PipelineRunsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ──────────────────────────────────────────────
  # Step Functions State Machine
  # ──────────────────────────────────────────────
  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-pipeline-${Stage}"
      StateMachineType: STANDARD
      RoleArn: "arn:aws:iam::966285262832:role/ai-software-factory-sfn-role"
      DefinitionString: !Sub |
        {
          "Comment": "AI Software Factory Pipeline",
          "StartAt": "StageCICD",
          "States": {
            "StageCICD": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "cicd",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.cicd",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "CheckOptB_SBOM"
            },
            "CheckOptB_SBOM": {
              "Type": "Choice",
              "Choices": [{"Variable": "$.mode", "StringEquals": "optB", "Next": "StageSBOM"}],
              "Default": "StageReview"
            },
            "StageSBOM": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "sbom",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.sbom",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StageReview"
            },
            "StageReview": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "review",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.review",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StageRemediation"
            },
            "StageRemediation": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "remediation",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.remediation",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "CheckOptB_Cybersec"
            },
            "CheckOptB_Cybersec": {
              "Type": "Choice",
              "Choices": [{"Variable": "$.mode", "StringEquals": "optB", "Next": "StageCybersec"}],
              "Default": "StageTestSelect"
            },
            "StageCybersec": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "cybersec",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.cybersec",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StageTestSelect"
            },
            "StageTestSelect": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "testselect",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.testselect",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "CheckOptB_Safety"
            },
            "CheckOptB_Safety": {
              "Type": "Choice",
              "Choices": [{"Variable": "$.mode", "StringEquals": "optB", "Next": "StageSafety"}],
              "Default": "StageTestEnv"
            },
            "StageSafety": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "safety",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.safety",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StageTestEnv"
            },
            "StageTestEnv": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "testenv",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.testenv",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StageFleetConfig"
            },
            "StageFleetConfig": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "fleetconfig",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.fleetconfig",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StageIntegration"
            },
            "StageIntegration": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "integration",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.integration",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StageDeploy"
            },
            "StageDeploy": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "deploy",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.deploy",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "StagePromotion"
            },
            "StagePromotion": {
              "Type": "Task",
              "Resource": "${PipelineStageFunction.Arn}",
              "Parameters": {
                "stageId": "promotion",
                "code.$": "$.code",
                "mode.$": "$.mode",
                "sessionId.$": "$.sessionId",
                "runId.$": "$.runId",
                "connectionId.$": "$.connectionId",
                "previousResults.$": "$.previousResults"
              },
              "ResultPath": "$.previousResults.promotion",
              "Retry": [{"ErrorEquals": ["States.ALL"], "MaxAttempts": 1, "BackoffRate": 2, "IntervalSeconds": 3}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "PipelineFailed", "ResultPath": "$.error"}],
              "Next": "PipelineComplete"
            },
            "PipelineComplete": {
              "Type": "Pass",
              "End": true
            },
            "PipelineFailed": {
              "Type": "Pass",
              "End": true
            }
          }
        }

Outputs:
  WebSocketUrl:
    Description: WebSocket API URL
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  HttpApiUrl:
    Description: HTTP API URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  SessionsTableName:
    Description: DynamoDB Sessions table name
    Value: !Ref SessionsTable

  ConnectionsTableName:
    Description: DynamoDB Connections table name
    Value: !Ref ConnectionsTable

  PipelineRunsTableName:
    Description: DynamoDB Pipeline Runs table name
    Value: !Ref PipelineRunsTable

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref PipelineStateMachine
